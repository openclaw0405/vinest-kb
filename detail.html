<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知識筆記詳情 - VINEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=23">
  <style>
    body { background: #F5EFE6; color: #1C1814; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #C9956C; }
    .meta { color: #9A8A76; margin: 10px 0; }
    .section { background: #EBE3D5; border: 1px solid #4A3F35; border-radius: 12px; padding: 20px; margin: 15px 0; }
    .section h2 { color: #C9956C; margin-top: 0; font-size: 18px; border-bottom: 1px solid #4A3F35; padding-bottom: 8px; }
    .section h3 { color: #9A8A76; margin: 12px 0 6px; font-size: 15px; }
    .stock-tag { display: inline-block; padding: 6px 12px; background: #5A8A5E; color: white; border-radius: 6px; margin: 4px; font-weight: 600; }
    .stock-reason { display: block; font-size: 12px; color: #9A8A76; margin-top: 4px; }
    a { color: #C9956C; }
    .back { display: inline-block; padding: 10px 20px; background: #C9956C; color: white; text-decoration: none; border-radius: 8px; margin-bottom: 20px; }
    ul { padding-left: 20px; line-height: 1.8; }
    li { margin: 4px 0; }
    .loading { text-align: center; padding: 40px; color: #9A8A76; }
    .tag { display: inline-block; padding: 3px 8px; background: #3A3028; border: 1px solid #4A3F35; border-radius: 4px; margin: 2px; font-size: 12px; }
    .tag-bull { border-color: #5A8A5E; color: #5A8A5E; }
    .tag-bear { border-color: #A0524A; color: #A0524A; }
    .tag-cc { border-color: #B8863A; color: #B8863A; }
    .thesis-box { background: #EBE3D5; border-left: 3px solid #C9956C; padding: 12px 16px; margin: 8px 0; border-radius: 0 8px 8px 0; }
    .thesis-box h4 { color: #9A8A76; margin: 0 0 8px; font-size: 14px; }
    .thesis-box p { margin: 0; color: #1C1814; font-size: 14px; line-height: 1.6; }
    .logic-chain { background: #EBE3D5; border: 1px solid #4A3F35; border-radius: 10px; padding: 14px; margin: 12px 0; }
    .logic-chain .topic { color: #B8863A; font-weight: 600; font-size: 15px; margin-bottom: 8px; }
    .logic-chain .chain { padding-left: 16px; border-left: 2px solid #4A3F35; margin: 8px 0; }
    .logic-chain .chain p { margin: 4px 0; font-size: 13px; color: #1C1814; }
    .logic-chain .premises { color: #9A8A76; font-size: 12px; padding-left: 16px; }
    .logic-chain .conclusion { color: #F0E8DC; font-size: 13px; margin-top: 8px; padding: 8px; background: #3A3028; border-radius: 6px; }
    .logic-chain .action { color: #5A8A5E; font-size: 13px; margin-top: 6px; }
    .logic-chain .expiry { color: #A0524A; font-size: 12px; margin-top: 4px; }
    .cross-ref { background: #EBE3D5; border: 1px solid #4A3F35; border-radius: 10px; padding: 14px; margin: 12px 0; }
    .cross-ref .topic { color: #B8863A; font-weight: 600; margin-bottom: 10px; }
.cross-ref .source { padding: 8px 12px; margin: 6px 0; background: #3A3028; border-radius: 6px; color: #F0E8DC; }
    .cross-ref .source-name { color: #D4AA84; font-weight: 600; }
    .cross-ref .winner { color: #5A8A5E; font-size: 13px; margin-top: 8px; padding: 6px 10px; background: #EBE3D5; border-radius: 4px; }
    .portfolio-app { background: #EBE3D5; border: 2px solid #C9956C; border-radius: 12px; padding: 20px; margin: 15px 0; }
    .portfolio-app h2 { color: #C9956C; margin-top: 0; }
    .portfolio-row { display: flex; padding: 8px 0; border-bottom: 1px solid #4A3F35; }
    .portfolio-row:last-child { border-bottom: none; }
    .portfolio-label { color: #9A8A76; width: 160px; flex-shrink: 0; }
    .portfolio-value { color: #1C1814; }
    .core-thesis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    .core-thesis-item { background: #EBE3D5; border-radius: 8px; padding: 10px 12px; }
    .core-thesis-item .key { color: #9A8A76; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
    .core-thesis-item .val { color: #1C1814; font-size: 13px; }
    .bull-bear-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
    .bull-section { border-left: 3px solid #5A8A5E; }
    .bear-section { border-left: 3px solid #A0524A; }
    .case-item { background: #EBE3D5; border-radius: 8px; padding: 10px 12px; margin: 6px 0; }
    .case-item .thesis { color: #1C1814; font-size: 13px; margin-bottom: 4px; }
    .case-item .meta { color: #9A8A76; font-size: 11px; }
    .catalyst-list, .risk-list { padding-left: 20px; }
    .catalyst-list li, .risk-list li { margin: 4px 0; font-size: 14px; }
    .positive-cat { color: #5A8A5E; }
    .negative-cat { color: #A0524A; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← 返回首頁</a>
    <div id="content"><div class="loading">載入中...</div></div>
  </div>
  <script>
    function esc(s) {
      if (!s && s !== 0) return '';
      return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }
    function isArray(o) { return Array.isArray(o); }
    function isObject(o) { return o && typeof o === 'object' && !Array.isArray(o); }

    async function init() {
      try {
        const resp = await fetch('entries.json?v=1782679502');
        const data = await resp.json();
        const entries = data.entries;
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const entry = entries.find(e => e.id === id);

        if (!entry) {
          document.getElementById('content').innerHTML = '<h1>找不到此筆記 (ID: ' + id + ')</h1>';
          return;
        }

        let html = '';

        // Header
        html += '<h1>' + esc(entry.title) + '</h1>';
        html += '<div class="meta">📅 ' + esc(entry.date || '-') + ' | 📺 ' + esc(entry.source_name || '-');
        if (entry.speaker) html += ' | 🎤 ' + esc(entry.speaker);
        html += '</div>';

        // Tags
        if (entry.companies?.length || entry.sectors?.length || entry.themes?.length) {
          let tagsHtml = '';
          (entry.companies||[]).forEach(t => tagsHtml += '<span class="tag">' + esc(t) + '</span>');
          (entry.sectors||[]).forEach(t => tagsHtml += '<span class="tag" style="border-color:#C9956C;color:#C9956C">' + esc(t) + '</span>');
          (entry.themes||[]).forEach(t => tagsHtml += '<span class="tag" style="border-color:#B8863A;color:#B8863A">' + esc(t) + '</span>');
          html += '<div style="margin:10px 0">' + tagsHtml + '</div>';
        }

        // ================================================================
        // CORE THESIS (new v2 field)
        // ================================================================
        if (isObject(entry.core_thesis)) {
          const ct = entry.core_thesis;
          html += '<div class="section"><h2>📊 核心論點</h2>';
          html += '<div class="core-thesis-grid">';
          for (const [k, v] of Object.entries(ct)) {
            if (v) html += '<div class="core-thesis-item"><div class="key">' + esc(k) + '</div><div class="val">' + esc(v) + '</div></div>';
          }
          html += '</div></div>';
        }

        // ================================================================
        // SUMMARY
        // ================================================================
        if (entry.summary_short) html += '<div class="section"><h2>📝 簡介</h2><p style="font-size:15px;color:#1C1814">' + esc(entry.summary_short) + '</p></div>';
        if (entry.summary_long) html += '<div class="section"><h2>📚 詳細摘要</h2><div style="line-height:1.8;color:#1C1814;margin:10px 0;font-size:14px">' + esc(entry.summary_long) + '</div></div>';

        // ================================================================
        // STOCK RECOMMENDATIONS (RICH VERSION)
        // ================================================================
        if (isArray(entry.stock_recommendations) && entry.stock_recommendations.length) {
          html += '<div class="section"><h2>🎯 股票推介</h2>';

          for (const s of entry.stock_recommendations) {
            const dir = s.direction || '';
            const dirColor = dir === 'long' ? '#5A8A5E' : dir === 'short' ? '#A0524A' : '#B8863A';
            const dirLabel = dir === 'long' ? '🟢 做多' : dir === 'short' ? '🔴 做淡' : dir === 'hold' || dir === 'neutral' ? '🟡 觀望' : '⚪ 中性';

            html += '<div style="margin:16px 0;padding:16px;background:#EBE3D5;border-radius:12px;border:1px solid #4A3F35">';

            // Header row: ticker + direction badge
            html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">';
            html += '<span style="font-size:20px;font-weight:700;color:#1C1814">' + esc(s.ticker || s.name || '') + '</span>';
            html += '<span style="padding:4px 12px;background:' + dirColor + ';color:white;border-radius:6px;font-size:13px;font-weight:600">' + dirLabel + '</span>';
            if (s.name && s.name !== s.ticker) html += '<span style="color:#9A8A76;font-size:14px">' + esc(s.name) + '</span>';
            html += '</div>';

            // 📌 投資論點
            if (s['投資論點'] || s.thesis) {
              html += '<div style="margin:10px 0;padding:10px 14px;background:#EBE3D5;border-radius:8px;border-left:3px solid ' + dirColor + '">';
              html += '<div style="color:#9A8A76;font-size:11px;margin-bottom:4px">📌 投資論點</div>';
              html += '<div style="color:#1C1814;font-size:14px;line-height:1.6">' + esc(s['投資論點'] || s.thesis) + '</div>';
              html += '</div>';
            }

            // 📣 講者論點
            if (s['講者論點'] || s.speaker_rationale || s.rationale) {
              html += '<div style="margin:8px 0;color:#1C1814;font-size:13px;line-height:1.6">';
              html += '<span style="color:#C9956C;font-weight:600">📣 講者論點：</span>' + esc(s['講者論點'] || s.speaker_rationale || s.rationale);
              html += '</div>';
            }

            // 📝 補充 note
            if (s.note) {
              html += '<div style="margin:8px 0;padding:10px 14px;background:#EBE3D5;border-radius:8px;color:#1C1814;font-size:13px;line-height:1.6">';
              html += '<span style="color:#9A8A76;font-weight:600">📝 補充：</span>' + esc(s.note);
              html += '</div>';
            }

            // ❝ 語錄
            if (s['語錄'] || s.speaker_quote) {
              html += '<div style="margin:8px 0;padding:10px 14px;background:#EBE3D5;border-radius:8px;font-style:italic;color:#B8863A;font-size:13px">';
              html += '' + esc(s['語錄'] || s.speaker_quote) + ' ❞';
              html += '</div>';
            }

            // Metrics row: 上限/下限/入市時機
            const metrics = [];
            if (s['上限'] || s.upside || s.upside_pct) metrics.push('<span style="color:#5A8A5E">↑ ' + esc(s['上限'] || s.upside || s.upside_pct) + '</span>');
            if (s['下限'] || s.downside || s.downside_pct) metrics.push('<span style="color:#A0524A">↓ ' + esc(s['下限'] || s.downside || s.downside_pct) + '</span>');
            if (s['入市時機'] || s.entry_timing) metrics.push('<span style="color:#B8863A">⏱ ' + esc(s['入市時機'] || s.entry_timing) + '</span>');
            if (metrics.length) {
              html += '<div style="margin:10px 0;display:flex;gap:16px;flex-wrap:wrap">' + metrics.join('') + '</div>';
            }

            // Thesis status badge
            const statusColor = s.thesis_status === 'active' ? '#5A8A5E' : s.thesis_status === 'monitoring' ? '#B8863A' : s.thesis_status === 'proved' ? '#C9956C' : '#9A8A76';
            if (s.thesis_status) {
              html += '<div style="margin:8px 0">';
              html += '<span style="display:inline-block;padding:3px 10px;background:' + statusColor + '22;border:1px solid ' + statusColor + ';color:' + statusColor + ';border-radius:20px;font-size:11px">';
              html += 'Thesis Status: ' + esc(s.thesis_status.toUpperCase());
              html += '</span>';
              html += '</div>';
            }

            // 🔄 重評條件
            if (s['重評條件'] || s.catalyst_for_reassessment) {
              html += '<div style="margin:8px 0;padding:8px 12px;background:#3A3028;border-radius:6px;font-size:12px;color:#F0E8DC">';
              html += '🔄 重評條件：' + esc(s['重評條件'] || s.catalyst_for_reassessment);
              html += '</div>';
            }

            html += '</div>';
          }
          html += '</div>';
        }

        // ================================================================
        // INVESTMENT MINDSET (v2: object with distinctions/process/philosophy)
        // ================================================================
        if (isObject(entry.investment_mindset)) {
          const im = entry.investment_mindset;
          html += '<div class="section"><h2>💡 投資心法</h2>';
          if (im.philosophy) html += '<div class="thesis-box"><h4>🎯 投資哲學</h4><p>' + esc(im.philosophy) + '</p></div>';
          if (isArray(im.distinctions) && im.distinctions.length) {
            html += '<h3>🔍 關鍵分辨</h3><ul>';
            im.distinctions.forEach(d => html += '<li>' + esc(d) + '</li>');
            html += '</ul>';
          }
          if (isArray(im.process) && im.process.length) {
            html += '<h3>⚙️ 操作流程</h3><ul>';
            im.process.forEach(p => html += '<li>' + esc(p) + '</li>');
            html += '</ul>';
          }
          html += '</div>';
        } else if (isArray(entry.investment_mindset) && entry.investment_mindset.length) {
          // Legacy: flat array
          html += '<div class="section"><h2>💡 投資心法</h2><ul>';
          entry.investment_mindset.forEach(p => html += '<li>' + esc(p) + '</li>');
          html += '</ul></div>';
        }

        // ================================================================
        // PERSONAL INSIGHTS (v2: personal_insights, legacy: insights)
        // ================================================================
        const insights = entry.personal_insights || entry.insights;
        if (isArray(insights) && insights.length) {
          html += '<div class="section"><h2>💎 心得體會</h2><ul>';
          insights.forEach(i => html += '<li>' + esc(i) + '</li>');
          html += '</ul></div>';
        }

        // ================================================================
        // KEY POINTS (legacy field)
        // ================================================================
        if (isArray(entry.key_points) && entry.key_points.length) {
          html += '<div class="section"><h2>📌 關鍵論點</h2><ul>';
          entry.key_points.forEach(p => html += '<li>' + esc(p) + '</li>');
          html += '</ul></div>';
        }

        // ================================================================
        // BULL / BEAR CASES — handles both legacy (array of strings) and v2 (object with thesis/trigger/講者論點)
        // ================================================================
        const hasBullCases = isObject(entry.bull_cases) && Object.keys(entry.bull_cases).length;
        const hasBearCases = isObject(entry.bear_cases) && Object.keys(entry.bear_cases).length;
        if (hasBullCases || hasBearCases) {
          html += '<div class="section"><h2>📈 看好 vs 看淡</h2>';
          html += '<div class="bull-bear-grid">';

          // ── BULL CASES ──
          if (hasBullCases) {
            html += '<div class="bull-section" style="padding:10px;flex:1">';
            html += '<h3 style="color:#5A8A5E;margin-bottom:12px">✅ 看好</h3>';
            for (const [topic, caseData] of Object.entries(entry.bull_cases)) {
              if (!caseData) continue;
              const isArrayFmt = isArray(caseData);
              const thesis    = isArrayFmt ? null : caseData.thesis;
              const trigger   = isArrayFmt ? null : caseData.trigger;
              const rationale = isArrayFmt ? null : caseData.講者論點;
              const points    = isArrayFmt ? caseData : (caseData.points || []);

              html += '<div style="margin-bottom:16px;padding:12px;background:#EBE3D5;border-radius:8px;border-left:3px solid #5A8A5E">';

              // Topic header
              html += '<div style="font-weight:700;color:#5A8A5E;font-size:14px;margin-bottom:6px">📌 ' + esc(topic) + '</div>';

              // Thesis (if v2 format)
              if (thesis) {
                html += '<div style="margin:6px 0;padding:8px 10px;background:#3A3028;border-radius:6px;font-size:13px;color:#F0E8DC;line-height:1.5">';
                html += '<span style="color:#5A8A5E;font-weight:600">論點：</span>' + esc(thesis) + '</div>';
              }

              // 講者論點 (speaker rationale — v2)
              if (rationale) {
                html += '<div style="margin:6px 0;color:#1C1814;font-size:12px;line-height:1.5">';
                html += '<span style="color:#C9956C;font-weight:600">📣 講者論點：</span>' + esc(rationale) + '</div>';
              }

              // Trigger (if v2)
              if (trigger) {
                html += '<div style="margin:4px 0;font-size:12px;color:#B8863A">⏱ 觸發條件：' + esc(trigger) + '</div>';
              }

              // Legacy / fallback bullet points
              if (points.length) {
                html += '<ul style="margin:6px 0 0 0;padding-left:16px;font-size:12px;color:#9A8A76;line-height:1.7">';
                points.forEach(p => {
                  if (!p) return;
                  const text = (typeof p === 'object' && p !== null) ? (p.item || p.text || JSON.stringify(p)) : String(p);
                  html += '<li>' + esc(text) + '</li>';
                });
                html += '</ul>';
              }

              // Key stocks (if v2)
              if (!isArrayFmt && caseData.key_stocks) {
                html += '<div style="margin:4px 0;font-size:12px;color:#5A8A5E">📊 相關股票：' + esc(caseData.key_stocks) + '</div>';
              }

              html += '</div>';
            }
            html += '</div>';
          }

          // ── BEAR CASES ──
          if (hasBearCases) {
            html += '<div class="bear-section" style="padding:10px;flex:1">';
            html += '<h3 style="color:#A0524A;margin-bottom:12px">❌ 看淡</h3>';
            for (const [topic, caseData] of Object.entries(entry.bear_cases)) {
              if (!caseData) continue;
              const isArrayFmt = isArray(caseData);
              const thesis    = isArrayFmt ? null : caseData.thesis;
              const trigger   = isArrayFmt ? null : caseData.trigger;
              const rationale = isArrayFmt ? null : caseData.講者論點;
              const points    = isArrayFmt ? caseData : (caseData.points || []);

              html += '<div style="margin-bottom:16px;padding:12px;background:#EBE3D5;border-radius:8px;border-left:3px solid #A0524A">';

              // Topic header
              html += '<div style="font-weight:700;color:#A0524A;font-size:14px;margin-bottom:6px">📌 ' + esc(topic) + '</div>';

              // Thesis (if v2 format)
              if (thesis) {
                html += '<div style="margin:6px 0;padding:8px 10px;background:#3A3028;border-radius:6px;font-size:13px;color:#F0E8DC;line-height:1.5">';
                html += '<span style="color:#A0524A;font-weight:600">論點：</span>' + esc(thesis) + '</div>';
              }

              // 講者論點 (speaker rationale — v2)
              if (rationale) {
                html += '<div style="margin:6px 0;color:#1C1814;font-size:12px;line-height:1.5">';
                html += '<span style="color:#C9956C;font-weight:600">📣 講者論點：</span>' + esc(rationale) + '</div>';
              }

              // Trigger / 重評條件 (if v2)
              if (trigger) {
                html += '<div style="margin:4px 0;font-size:12px;color:#B8863A">⏱ 觸發條件：' + esc(trigger) + '</div>';
              }

              // Legacy / fallback bullet points
              if (points.length) {
                html += '<ul style="margin:6px 0 0 0;padding-left:16px;font-size:12px;color:#9A8A76;line-height:1.7">';
                points.forEach(p => {
                  if (!p) return;
                  const text = (typeof p === 'object' && p !== null) ? (p.item || p.text || JSON.stringify(p)) : String(p);
                  html += '<li>' + esc(text) + '</li>';
                });
                html += '</ul>';
              }

              // trigger_for_reassessment (legacy v2)
              if (!isArrayFmt && caseData.trigger_for_reassessment) {
                html += '<div style="margin:4px 0;font-size:12px;color:#A0524A">🔄 重評條件：' + esc(caseData.trigger_for_reassessment) + '</div>';
              }

              html += '</div>';
            }
            html += '</div>';
          }

          html += '</div></div>';
        }

        // Legacy bull_points / bear_points (flat arrays — pre-v2)
        if (!hasBullCases && isArray(entry.bull_points) && entry.bull_points.length) {
          html += '<div class="section"><h2>✅ 看好論點</h2><ul>';
          entry.bull_points.forEach(p => html += '<li>' + esc(p) + '</li>');
          html += '</ul></div>';
        }
        if (!hasBearCases && isArray(entry.bear_points) && entry.bear_points.length) {
          html += '<div class="section"><h2>❌ 看淡論點</h2><ul>';
          entry.bear_points.forEach(p => html += '<li>' + esc(p) + '</li>');
          html += '</ul></div>';
        }

        // ================================================================
        // CATALYSTS (v2: {positive:[], negative:[]})
        // ================================================================
        if (isObject(entry.catalysts)) {
          const pos = entry.catalysts.positive || [];
          const neg = entry.catalysts.negative || [];
          if (pos.length || neg.length) {
            html += '<div class="section"><h2>🚀 催化劑</h2>';
            if (pos.length) {
              html += '<h3 class="positive-cat">🟢 正面催化劑</h3><ul class="catalyst-list">';
              pos.forEach(c => html += '<li class="positive-cat">' + esc(c) + '</li>');
              html += '</ul>';
            }
            if (neg.length) {
              html += '<h3 class="negative-cat">🔴 負面催化劑</h3><ul class="catalyst-list">';
              neg.forEach(c => html += '<li class="negative-cat">' + esc(c) + '</li>');
              html += '</ul>';
            }
            html += '</div>';
          }
        } else if (isArray(entry.catalysts) && entry.catalysts.length) {
          // Legacy flat array
          html += '<div class="section"><h2>🚀 催化劑</h2><ul>';
          entry.catalysts.forEach(c => html += '<li>' + esc(c) + '</li>');
          html += '</ul></div>';
        }

        // ================================================================
        // RISKS (v2: {market:[], thematic:[], liquidity:[]})
        // ================================================================
        if (isObject(entry.risks)) {
          const market = entry.risks.market || [];
          const thematic = entry.risks.thematic || [];
          const liquidity = entry.risks.liquidity || [];
          if (market.length || thematic.length || liquidity.length) {
            html += '<div class="section"><h2>⚠️ 風險</h2>';
            if (market.length) {
              html += '<h3 style="color:#B8863A">📊 市場風險</h3><ul class="risk-list">';
              market.forEach(r => html += '<li>' + esc(r) + '</li>');
              html += '</ul>';
            }
            if (thematic.length) {
              html += '<h3 style="color:#A0524A">🎯 主題風險</h3><ul class="risk-list">';
              thematic.forEach(r => html += '<li>' + esc(r) + '</li>');
              html += '</ul>';
            }
            if (liquidity.length) {
              html += '<h3 style="color:#C9956C">💧 流動性風險</h3><ul class="risk-list">';
              liquidity.forEach(r => html += '<li>' + esc(r) + '</li>');
              html += '</ul>';
            }
            html += '</div>';
          }
        } else if (isArray(entry.risks) && entry.risks.length) {
          // Legacy flat array
          html += '<div class="section"><h2>⚠️ 風險</h2><ul>';
          entry.risks.forEach(r => html += '<li>' + esc(r) + '</li>');
          html += '</ul></div>';
        }

        // ================================================================
        // LOGIC CHAINS (v2)
        // ================================================================
        if (isArray(entry.logic_chains) && entry.logic_chains.length) {
          html += '<div class="section"><h2>🧠 邏輯鏈</h2>';
          for (const lc of entry.logic_chains) {
            html += '<div class="logic-chain">';
            html += '<div class="topic">📌 ' + esc(lc.topic || '') + '</div>';

            if (isArray(lc.premise_facts) && lc.premise_facts.length) {
              html += '<div class="premises"><strong>前提事實：</strong>';
              lc.premise_facts.forEach(p => html += '<div>• ' + esc(p) + '</div>');
              html += '</div>';
            }

            if (lc.reasoning_chain) {
              html += '<div class="chain"><p><strong>推理鏈：</strong>' + esc(lc.reasoning_chain) + '</p></div>';
            }

            if (lc.speaker_conclusion) {
              html += '<div class="conclusion">📣 結論：' + esc(lc.speaker_conclusion) + '</div>';
            }

            const conf = lc.confidence || '';
            const confColor = conf === 'high' ? '#5A8A5E' : conf === 'medium' ? '#B8863A' : conf === 'low' ? '#A0524A' : '#9A8A76';
            if (conf) html += '<div style="margin-top:8px;font-size:12px;color:' + confColor + '">信心度：' + esc(conf) + '</div>';

            if (lc.expiry_condition) html += '<div class="expiry">⚠️ 失效條件：' + esc(lc.expiry_condition) + '</div>';
            if (lc.action) html += '<div class="action">🎯 操作：' + esc(lc.action) + '</div>';

            html += '</div>';
          }
          html += '</div>';
        }

        // ================================================================
        // CROSS REFERENCES (v2)
        // ================================================================
        if (isArray(entry.cross_references) && entry.cross_references.length) {
          html += '<div class="section"><h2>🔄 交叉對比</h2>';
          for (const cr of entry.cross_references) {
            html += '<div class="cross-ref">';
            html += '<div class="topic">📌 ' + esc(cr.topic || '') + '</div>';

            if (cr.source_a) {
              html += '<div class="source">';
              html += '<span class="source-name">A：' + esc(cr.source_a.name || '') + '</span>';
              if (cr.source_a.view) html += '<div style="color:#F0E8DC;font-size:13px;margin-top:4px">' + esc(cr.source_a.view) + '</div>';
              if (cr.source_a.premise) html += '<div style="color:#B8A898;font-size:12px;margin-top:4px">前提：' + esc(cr.source_a.premise) + '</div>';
              html += '</div>';
            }

            if (cr.source_b) {
              html += '<div class="source">';
              html += '<span class="source-name">B：' + esc(cr.source_b.name || '') + '</span>';
              if (cr.source_b.view) html += '<div style="color:#F0E8DC;font-size:13px;margin-top:4px">' + esc(cr.source_b.view) + '</div>';
              if (cr.source_b.premise) html += '<div style="color:#B8A898;font-size:12px;margin-top:4px">前提：' + esc(cr.source_b.premise) + '</div>';
              html += '</div>';
            }

            if (cr.who_wins_when) html += '<div class="winner">🏆 邊個啱：' + esc(cr.who_wins_when) + '</div>';
            if (cr.key_insight) html += '<div style="margin-top:8px;color:#B8863A;font-size:13px">💡 ' + esc(cr.key_insight) + '</div>';

            html += '</div>';
          }
          html += '</div>';
        }

        // ================================================================
        // PORTFOLIO APPLICATION (v2)
        // ================================================================
        if (isObject(entry.portfolio_application) && Object.keys(entry.portfolio_application).length) {
          const pa = entry.portfolio_application;
          html += '<div class="portfolio-app"><h2>💼 Kenneth 個人應用</h2>';
          const fields = [
            ['kenneth_holds', 'Kenneth 持倉'],
            ['hk_platform_action', 'Platform 股操作'],
            ['gold_action', '黃金操作'],
            ['a_share_action', 'A股操作'],
            ['us_ai_action', '美股AI操作'],
            ['asymmetric_bet', '非對稱押注'],
            ['confidence', '信心度 (1-5)'],
            ['note', '備註']
          ];
          for (const [k, label] of fields) {
            if (pa[k]) {
              html += '<div class="portfolio-row">';
              html += '<div class="portfolio-label">' + esc(label) + '</div>';
              html += '<div class="portfolio-value">' + esc(String(pa[k])) + '</div>';
              html += '</div>';
            }
          }
          html += '</div>';
        }

        // ================================================================
        // OPEN QUESTIONS
        // ================================================================
        if (isArray(entry.open_questions) && entry.open_questions.length) {
          html += '<div class="section"><h2>❓ 待解答問題</h2><ul>';
          entry.open_questions.forEach(q => html += '<li>' + esc(q) + '</li>');
          html += '</ul></div>';
        }

        // ================================================================
        // NOTES
        // ================================================================
        if (entry.notes) html += '<div class="section"><h2>📝 筆記</h2><p style="color:#9A8A76;font-size:13px">' + esc(entry.notes) + '</p></div>';

        // ================================================================
        // SOURCE LINK
        // ================================================================
        if (entry.source_url) {
          html += '<div style="margin:20px 0;text-align:center">';
          html += '<a href="' + esc(entry.source_url) + '" target="_blank" style="padding:12px 24px;background:#A0524A;color:white;text-decoration:none;border-radius:8px;font-size:15px">▶️ 前往 YouTube 影片</a>';
          html += '</div>';
        }

        document.getElementById('content').innerHTML = html;
      } catch(e) {
        document.getElementById('content').innerHTML = '<h1>Error: ' + e.message + '</h1>';
      }
    }
    init();
  </script>
</body>
</html>
